<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open App</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .message {
            margin-bottom: 50px;
        }
        .input-container {
            margin: 50px 0;
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div>Test app link</div>

    <div class="input-container">
        <button onclick="openLink()">Go to Link</button>
    </div>


    <script>
        function openLink() {
            // Resolve relative to this page so it works on any host serving /oha_jumpapp/
            const link = new URL('open-app.html', window.location.href).href;
            window.open(link, '_blank');
        }
    </script>

</body>
</html>
